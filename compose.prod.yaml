# The whole site on a server: docker compose -f compose.prod.yaml up -d --build
# Settings come from .env next to this file; deploy/.env.production.example lists them.
# Only Caddy is reachable from outside. See README, "Going live".
# Not "xenonfix", which is the development setup's name: they must never share a database volume.
name: xenonfix-prod

services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: xenonfix
      MARIADB_USER: ${DB_USERNAME:-xenonfix_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/xenonfix
      DB_USERNAME: ${DB_USERNAME:-xenonfix_app}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Used only while there is no admin, at the very first start
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?set SPRING_MAIL_HOST in .env}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      # Only for a trial run against a mail catcher; leave both unset on the real server
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
    volumes:
      - uploads:/data/uploads
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8090
      # Host names the server renders pages for, besides those in angular.json
      NG_ALLOWED_HOSTS: ${SITE_HOST:-xenonfix.lv}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/robots.txt').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    environment:
      SITE_HOST: ${SITE_HOST:-xenonfix.lv}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  # Back up mariadb-data and uploads together: deploy/backup.sh
  mariadb-data:
  uploads:
  # Caddy's certificates; losing them only means getting new ones
  caddy-data:
  caddy-config:
