spring:
  application:
    name: xenonfix
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3308/xenonfix}
    username: ${DB_USERNAME:xenonfix_app}
    password: ${DB_PASSWORD}
    hikari:
      # The health endpoint must answer soon when the database is down
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

app:
  # Uploaded files stay on disk and the database holds their paths. Served at /uploads/**.
  uploads-path: ${APP_UPLOADS_PATH:./uploads}

server:
  port: ${SERVER_PORT:8090}
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    # These two log the JDBC URL at startup, and the MariaDB driver includes the database
    # password in it. Warnings and errors are still logged.
    org.flywaydb.core.FlywayExecutor: WARN
    org.hibernate.orm.connections.pooling: WARN
