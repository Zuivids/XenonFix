spring:
  application:
    name: xenonfix
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3308/xenonfix}
    username: ${DB_USERNAME:xenonfix_app}
    password: ${DB_PASSWORD}
    hikari:
      # The health endpoint must answer soon when the database is down
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Phone photos, which are reduced after upload
      max-file-size: 20MB
      max-request-size: 21MB
  # The server is set with SPRING_MAIL_HOST and the like. Without one the application does not
  # start, so a server cannot go live while silently unable to send email.
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  # Uploaded files stay on disk and the database holds their paths. Served at /uploads/**.
  uploads-path: ${APP_UPLOADS_PATH:./uploads}
  # First admin, created at startup only while there are no admins. The others are added in
  # the admin panel. This password must be changed at first login.
  bootstrap-admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
    password-change-required: true
  lockout:
    # Per account and client IP: an attacker blocks only their own address
    max-failed-attempts-per-ip: 5
    # Per account from all addresses: the backstop against guessing from many addresses
    max-failed-attempts: 20
    duration: 15m
  # Requests per client IP to the login and password change endpoints
  rate-limit:
    limit: 20
    window: 1m
  session:
    idle: 30m
    absolute: 8h
  reservation:
    # Reservations per client IP: enough for a customer, and limits a bot filling the form
    rate-limit:
      limit: 5
      window: 10m
    # After this the customer's details are erased from cancelled and completed reservations,
    # every night. The privacy policy states the same period ("6 months"): change both together.
    retention: 183d
  mail:
    from: ${APP_MAIL_FROM:info@xenonfix.lv}
    shop: ${APP_MAIL_SHOP:info@xenonfix.lv}

server:
  port: ${SERVER_PORT:8090}
  tomcat:
    # Reads an oversized upload to the end, so the browser gets the error instead of a dropped connection
    max-swallow-size: 40MB
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: true
        same-site: strict

logging:
  level:
    # These two log the JDBC URL at startup, and the MariaDB driver includes the database
    # password in it. Warnings and errors are still logged.
    org.flywaydb.core.FlywayExecutor: WARN
    org.hibernate.orm.connections.pooling: WARN
