# Local development only. dev-start.bat / dev-start.sh activate it; never use it in staging or production.

spring:
  config:
    # Database and admin settings from the .env in the repository root. Backend runs from backend/.
    import: optional:file:../.env[.properties]
  mail:
    # Mailpit from compose.yaml catches all email and nothing leaves this computer, unless .env
    # names a real mail server. See .env.example.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:${MAILPIT_SMTP_PORT:1026}}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

app:
  bootstrap-admin:
    # The local password stays the one in .env, also after resetting the database
    password-change-required: false

server:
  servlet:
    session:
      cookie:
        # Allows the session cookie over plain http://localhost
        secure: false
